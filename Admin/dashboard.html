<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard | EduSphere Admin</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="../style.css"></head><body>
<div class="site-top">EduSphere Admin — Management Panel</div>
<div class="container-fluid"><div class="row g-0">
<aside class="col-12 col-md-2 sidebar"><div class="admin-brand">EduSphere Admin</div><a class="active" href="dashboard.html">Dashboard</a><a class="" href="manage-courses.html">Courses</a><a class="" href="manage-students.html">Students</a><a class="" href="manage-categories.html">Categories</a><a class="" href="manage-enrollments.html">Enrollments</a><a class="" href="reports.html">Reports</a><a class="" href="login.html">Logout</a></aside>
<main class="col-12 col-md-10"><div class="admin-top d-flex justify-content-between"><span>Dashboard</span><span class="small-muted">Administrator</span></div>
<div class="admin-content">
<div class="row g-3 mb-3">
<div class="col-6 col-xl-3"><div class="stat-card"><div class="num" data-stat="students">0</div><div class="label">Total Students</div></div></div>
<div class="col-6 col-xl-3"><div class="stat-card"><div class="num" data-stat="courses">0</div><div class="label">Active Courses</div></div></div>
<div class="col-6 col-xl-3"><div class="stat-card"><div class="num" data-stat="revenue">$0</div><div class="label">Revenue</div></div></div>
<div class="col-6 col-xl-3"><div class="stat-card"><div class="num" data-stat="enrollments">0</div><div class="label">Enrollments</div></div></div>
</div>
<div class="row g-3">
<div class="col-lg-7"><div class="chart-box"><b class="small">Enrollments per Month</b><div data-chart="enroll-month" class="mt-3"></div></div></div>
<div class="col-lg-5"><div class="chart-box"><b class="small">Recent Enrollments</b><div class="mt-3" data-recent-list></div></div></div>
</div>
<div class="table-card mt-3"><div class="table-responsive"><table class="table"><thead><tr><th>Student</th><th>Course</th><th>Date</th><th>Status</th></tr></thead><tbody data-recent-table></tbody></table></div></div>
</div></main>
</div></div>
<script src="../app.js" defer></script>
<footer class="admin-footer"><span>© 2026 EduSphere Admin</span><span>Management Panel</span></footer>
</body></html>
