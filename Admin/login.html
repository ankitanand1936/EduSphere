
<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Admin Login | EduSphere</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">

    <style>
        .demo-credentials {
            background: #f1f3f5;
            border: 1px solid #d9dde2;
            border-radius: 8px;
            padding: 14px;
            margin-bottom: 20px;
        }

        .demo-credentials h6 {
            font-size: 14px;
            font-weight: 700;
            color: #252a31;
            margin-bottom: 12px;
        }

        .credential-row {
            font-size: 13px;
            margin-bottom: 7px;
            color: #555;
        }

        .credential-row strong {
            color: #20252d;
        }

        .demo-note {
            font-size: 11px;
            color: #666;
            margin-top: 10px;
            margin-bottom: 0;
        }
    </style>
</head>

<body>

    <div class="login-page">

        <div class="login-box">

            <h4>EduSphere Admin</h4>
            <p class="text-muted small mb-4">Sign in to access the admin dashboard</p>

            <!-- Demo Credentials -->
            <div class="demo-credentials">

                <h6>Demo Admin Credentials</h6>

                <div class="credential-row">
                    <strong>Email:</strong> admin@edusphere.com
                </div>

                <div class="credential-row">
                    <strong>Password:</strong> admin123
                </div>

                <p class="demo-note">
                    Use these credentials to access the admin panel.
                </p>

            </div>

            <!-- Admin Login Form -->
            <form data-form="admin-login">

                <label class="form-label">Username / Email</label>

                <input
                    class="form-control mb-3"
                    type="email"
                    name="email"
                    placeholder="Enter admin email"
                    required
                >

                <label class="form-label">Password</label>

                <input
                    type="password"
                    name="password"
                    class="form-control mb-3"
                    placeholder="Enter password"
                    required
                >

                <button type="submit" class="btn btn-primary-custom w-100">
                    Login
                </button>

            </form>

            <div class="text-center mt-3">
                <a href="../index.html" class="small text-decoration-none">
                    Back to Home
                </a>
            </div>

        </div>

    </div>

    <footer class="admin-footer">
        © 2026 EduSphere Admin · All Rights Reserved
    </footer>

    <script src="../app.js" defer></script>

</body>
</html>
